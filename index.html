<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#f2f2f7"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><script>/* Statusleiste passend zum gespeicherten Farbschema, BEVOR iOS sie beim Start ausliest. Mit black-translucent ist die Schrift der Uhrzeit weiss; damit sie auf heller App lesbar bleibt, legt iOS einen dunklen, verschwommenen Verlauf darunter - der graue Schleier oben. Im hellen Modus daher default (dunkle Schrift, kein Verlauf). */try{var t=JSON.parse(localStorage.getItem("training-app:app-theme"));if(t==="dark"){document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content","black-translucent");document.querySelector('meta[name="theme-color"]').setAttribute("content","#000000");document.documentElement.style.backgroundColor="#000000";}}catch(e){}</script><meta name="apple-mobile-web-app-title" content="Iron Log"/><meta name="mobile-web-app-capable" content="yes"/><title>Iron Log</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
